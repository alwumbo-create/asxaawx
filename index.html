<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Absensi & Jurnal Mengajar Guru</title>
  
  <!-- Favicon -->
  <link rel="icon" href="https://static.vecteezy.com/system/resources/previews/016/716/181/large_2x/website-3d-icon-png.png" type="image/x-icon" />

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8f9fa;
    }
    .iframe-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    
    /* Layout Loading Screen */
    .loader-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    
    /* Spinner Animation */
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #e9ecef;
      border-bottom-color: #0d6efd;
      border-radius: 50%;
      display: inline-block;
      animation: rotation 1s linear infinite;
    }
    
    .loader-title {
      margin-top: 20px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #212529;
    }

    .loader-subtext {
      margin-top: 6px;
      font-size: 0.875rem;
      color: #6c757d;
    }

    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="iframe-container">
    <!-- Indikator Loading -->
    <div class="loader-wrapper" id="loader">
      <div class="spinner"></div>
      <div class="loader-title">Sistem Absensi & Jurnal Mengajar Guru</div>
      <div class="loader-subtext">Memuat aplikasi, harap tunggu...</div>
    </div>

    <!-- Google Apps Script Web App -->
    <iframe 
      src="https://script.google.com/macros/s/AKfycby93o7waswfZ08aAUje8pyo6ZnY5lBXW8qTf-YfdGfdZTNj8mlsShtZVsfpJLMvAzjV/exec" 
      title="Sistem Absensi & Jurnal Mengajar Guru"
      onload="hideLoader()"
      allow="geolocation; camera; microphone; clipboard-write;"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
      }
    }
  </script>

</body>
</html>
